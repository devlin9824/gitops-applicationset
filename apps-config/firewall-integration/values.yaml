image:
  registry: docker.io
  repository: d4vlin/firewall-service
  tag: "uat-20260302-104515"

containerPorts:
  http: 8080

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  targetPort:
    http: 8080

env:
  LOG_LEVEL: "info"
  ADMIN_ENABLED: "false"
  DB_POOL_ENABLED: "true"
  LAST_USED_UPDATE_MIN_INTERVAL_SECONDS: "900"

extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: firewall-integration-env
        key: DATABASE_URL
  - name: API_KEY_PEPPER
    valueFrom:
      secretKeyRef:
        name: firewall-integration-env
        key: API_KEY_PEPPER

podLabels:
  role: public

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

gatewayApi:
  enabled: true
  gatewayName: traefik-gateway
  gatewayNamespace: traefik
  httpsSectionName: websecure
  httpSectionName: web
  redirectToHttps: true
  hostnames:
    - api.uat.local
  rules:
    - pathPrefix: /
      serviceName: firewall-integration
      servicePort: 8080
