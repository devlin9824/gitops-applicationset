image:
  registry: docker.io
  repository: d4vlin/firewall-service
  tag: "uat-20260203-074339"

containerPorts:
  http: 8080

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort:
    http: 8080

env:
  LOG_LEVEL: "info"
  ADMIN_ENABLED: "true"

  # Bootstrap: Bật "true" nếu DB UAT mới tinh chưa có key. Set lại "false" sau khi tạo xong.
  ALLOW_BOOTSTRAP_ADMIN_API_KEY: "true" 

  # TI scheduler: bật ở admin (replica=1)
  TI_ENABLED: "true"
  TI_DAILY_RECHECK_ENABLED: "true"
  TI_DAILY_RECHECK_HOUR: "2"
  TI_DAILY_RECHECK_MINUTE: "0"
  TI_MAX_ITEMS_PER_RUN: "500"
  TI_CONCURRENCY: "10"
  VT_MALICIOUS_ENGINES: "1"
  ABUSEIPDB_MALICIOUS_SCORE: "50"

  # Performance & Audit (Bật Audit nếu muốn vết tích kỹ hơn ở Admin)
  AUDIT_ENABLED: "false" 
  LAST_USED_UPDATE_MIN_INTERVAL_SECONDS: "900"

  # Optional
  METRICS_ENABLED: "false"
  TRACING_ENABLED: "false"

extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: DATABASE_URL
  - name: API_KEY_PEPPER
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: API_KEY_PEPPER

  # BOOTSTRAP KEY
  - name: ADMIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ADMIN_API_KEY

  # Threat Intel provider keys (Đổi thành bắt buộc - fail fast nếu thiếu key)
  - name: VT_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: VT_API_KEY
        optional: false 
  - name: ABUSEIPDB_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ABUSEIPDB_API_KEY
        optional: false

gatewayApi:
  enabled: false

# Security Context chuẩn Kyverno & Best Practice (Đồng bộ với App)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true 

podLabels:
  role: admin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi
