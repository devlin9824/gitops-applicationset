image:
  registry: docker.io
  repository: d4vlin/firewall-service
  tag: "uat-20260130-114142"

containerPorts:
  http: 8080

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort:
    http: 8080

env:
  LOG_LEVEL: "info"
  ADMIN_ENABLED: "true"

  # Bootstrap (chỉ bật tạm lúc tạo admin key lần đầu)
  ALLOW_BOOTSTRAP_ADMIN_API_KEY: "true"

  # TI scheduler: bật ở admin (replica=1) để không bị chạy trùng
  TI_ENABLED: "true"
  TI_DAILY_RECHECK_ENABLED: "true"
  TI_DAILY_RECHECK_HOUR: "2"
  TI_DAILY_RECHECK_MINUTE: "0"
  TI_MAX_ITEMS_PER_RUN: "500"
  TI_CONCURRENCY: "10"
  VT_MALICIOUS_ENGINES: "1"
  ABUSEIPDB_MALICIOUS_SCORE: "50"

  # Optional
  METRICS_ENABLED: "false"
  TRACING_ENABLED: "false"

extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: DATABASE_URL
  - name: API_KEY_PEPPER
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: API_KEY_PEPPER

  # BOOTSTRAP KEY (dùng 1 lần; tạo xong admin DB key thì để ALLOW_BOOTSTRAP...=false và cân nhắc xoá ADMIN_API_KEY khỏi secret)
  - name: ADMIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ADMIN_API_KEY

  # Threat Intel provider keys
  - name: VT_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: VT_API_KEY
        optional: true
  - name: ABUSEIPDB_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ABUSEIPDB_API_KEY
        optional: true
gatewayApi:
  enabled: false

podLabels:
  role: admin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi
