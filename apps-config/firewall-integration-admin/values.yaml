image:
  registry: docker.io
  repository: d4vlin/firewall-integration-service
  tag: "trial-20260320-1"
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3

containerPorts:
  http: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort:
    http: 8080

env:
  LOG_LEVEL: "info"
  ADMIN_ENABLED: "true"
  DOCS_ENABLED: "true"
  AUDIT_ENABLED: "true"
  DB_POOL_ENABLED: "true"
  ALLOW_BOOTSTRAP_ADMIN_API_KEY: "true"
  LAST_USED_UPDATE_MIN_INTERVAL_SECONDS: "900"

extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: DATABASE_URL
  - name: API_KEY_PEPPER
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: API_KEY_PEPPER
  - name: ADMIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ADMIN_API_KEY
        optional: true

podLabels:
  role: admin

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

imagePullSecrets:
  - name: dockerhub-regcred

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

gatewayApi:
  enabled: false
