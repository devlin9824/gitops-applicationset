image:
  registry: docker.io
  repository: d4vlin/firewall-service
  tag: "uat-20260203-074339"

containerPorts:
  http: 8080

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort:
    http: 8080

env:
  LOG_LEVEL: "info"
  ADMIN_ENABLED: "true"

  # CHỈ bật khi DB mới tinh cần bootstrap key, xong thì tắt
  ALLOW_BOOTSTRAP_ADMIN_API_KEY: "false"

  LAST_USED_UPDATE_MIN_INTERVAL_SECONDS: "900"

extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: DATABASE_URL
  - name: API_KEY_PEPPER
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: API_KEY_PEPPER

  # bootstrap key (chỉ cần khi ALLOW_BOOTSTRAP_ADMIN_API_KEY=true)
  - name: ADMIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: firewall-integration-admin-env
        key: ADMIN_API_KEY
        optional: true

gatewayApi:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

podLabels:
  role: admin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi
